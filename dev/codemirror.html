<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/yasgui.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>YASGUI · CodeMirror</title>
  </head>
  <body>
    <div class="navBar">
      <nav style="display: flex">
        <img class="logo" src="/yasgui.png" style="max-height:50px;padding:5px;margin-left: 10px" alt="Yasgui Logo" />
        <ul style="display: flex; list-style: none; align-self: center">
          <li class="navItem"><a class="nav-link" href="/">Yasgui</a></li>
          <li class="navItem active"><a class="nav-link" href="codemirror">CodeMirror</a></li>
          <li class="navItem"><a class="nav-link" href="yasqe">Yasqe</a></li>
          <li class="navItem"><a class="nav-link" href="yasr">Yasr</a></li>
        </ul>
        <button class="themeToggle" id="darkModeToggle" type="button"></button>
      </nav>
    </div>

    <div id="yasgui"></div>

    <script type="module">
      // Yasgui is editor-independent: the consumer imports an editor and passes a factory.
      // Here we use the CodeMirror 6 editor with the qlue-ls language server
      import Yasgui from "@zazuko/yasgui";
      import Yasqe from "@zazuko/yasqe-codemirror";
      import { createQlueLsClient, qlueLs } from "./qluelsCmClient";
      import { setupThemeToggle, DEMO_ENDPOINT } from "./utils";

      const theme = setupThemeToggle((t) => window.yasgui.yasqe?.setTheme(t));

      let clientPromise;
      const getClient = () => (clientPromise ??= createQlueLsClient());
      const endpointOf = () => window.yasgui?.getTab()?.getEndpoint() ?? DEMO_ENDPOINT;
      const onReady = (settings) => (client) => {
        qlueLs.configureSettings(client, settings);
        qlueLs.configureBackend(client, endpointOf());
      };
      const onEndpointChange = (client, endpoint) => qlueLs.configureBackend(client, endpoint);

      window.yasgui = new Yasgui(document.getElementById("yasgui"), {
        requestConfig: { endpoint: DEMO_ENDPOINT },
        yasqe: (parent, conf) =>
          new Yasqe(parent, {
            ...conf,
            theme,
            languageServers: [
              {
                label: "Qlue-ls",
                description: "SPARQL language server with endpoint-powered completions",
                client: getClient,
                onReady: onReady({ completion: { timeoutMs: 1000, resultSizeLimit: 50 } }),
                onEndpointChange,
              },
              {
                label: "Qlue-ls (aligned)",
                description: "Same engine, alternative formatting (WHERE on its own line, aligned predicates)",
                client: getClient,
                onReady: onReady({ format: { whereNewLine: true, alignPredicates: true } }),
                onEndpointChange,
              },
            ],
          }),
      });
    </script>
  </body>
</html>
