<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/sparql-studio.svg" />
    <link rel="stylesheet" href="./style.css" />
    <title>SPARQL Studio with SWLS</title>
  </head>
  <body>
    <div class="navBar">
      <nav style="display: flex">
        <img class="logo" src="/sparql-studio.svg" style="max-height:50px;padding:5px;margin-left: 10px" alt="SPARQL Studio Logo" />
        <ul style="display: flex; list-style: none; align-self: center">
          <li class="navItem active"><a class="nav-link" href="/">SPARQL Studio</a></li>
          <li class="navItem"><a class="nav-link" href="yasqe">Yasqe</a></li>
          <li class="navItem"><a class="nav-link" href="yasr">Yasr</a></li>
        </ul>
        <button class="themeToggle" id="darkModeToggle" type="button"></button>
      </nav>
    </div>

    <div id="yasgui"></div>

    <script type="module">
      import SparqlStudio from "@rdfjs/sparql-studio";
      import Yasqe, { qlueLs } from "@rdfjs/sparql-editor-monaco";
      import QlueLsWorker from "./qluels.worker?worker";
      import { setupThemeToggle, DEMO_ENDPOINT } from "./utils";
      window.onpageshow = function () {
        const theme = setupThemeToggle((t) => window.yasgui.yasqe?.setTheme(t));
        window.yasgui = new SparqlStudio(document.getElementById("yasgui"), {
          requestConfig: { endpoint: DEMO_ENDPOINT },
          yasqe: (parent, conf) =>
            new Yasqe(parent, {
              ...conf,
              theme,
              languageServers: [
                {
                  label: "Qlue-ls",
                  worker: () => new QlueLsWorker({ name: "qlue-ls" }),
                  onReady: (client) => {
                    qlueLs.configureSettings(client);
                    qlueLs.configureBackend(client, window.yasgui?.getTab()?.getEndpoint() ?? DEMO_ENDPOINT);
                  },
                  onEndpointChange: (client, endpoint) => qlueLs.configureBackend(client, endpoint),
                },
              ],
            }),
        });
      };
    </script>
  </body>
</html>
