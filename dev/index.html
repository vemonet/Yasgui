<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/yasgui.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>YASGUI</title>
  </head>
  <body>
    <div class="navBar">
      <nav style="display: flex">
        <img class="logo" src="/yasgui.png" style="max-height:50px;padding:5px;margin-left: 10px" alt="Yasgui Logo" />
        <ul style="display: flex; list-style: none; align-self: center">
          <li class="navItem active"><a class="nav-link" href="/">Yasgui</a></li>
          <li class="navItem"><a class="nav-link" href="codemirror">CodeMirror</a></li>
          <li class="navItem"><a class="nav-link" href="yasqe">Yasqe</a></li>
          <li class="navItem"><a class="nav-link" href="yasr">Yasr</a></li>
        </ul>
        <button class="themeToggle" id="darkModeToggle" type="button"></button>
      </nav>
    </div>

    <div id="yasgui"></div>

    <script type="module">
      // Yasgui is editor-independent: import an editor and pass a factory. Here we use the
      // Monaco-based @zazuko/yasqe with the qlue-ls language server (provided by the embedder).
      import Yasgui from "@zazuko/yasgui";
      import Yasqe, { qlueLs } from "@zazuko/yasqe";
      import { setupThemeToggle, createQlueLsWorker, DEMO_ENDPOINT } from "./utils";
      // yasgui/yasqe are LS-agnostic; to switch to another SPARQL language server only ./qluels changes.
      window.onpageshow = function () {
        const theme = setupThemeToggle((t) => window.yasgui.yasqe?.setTheme(t));

        const endpointOf = () => window.yasgui?.getTab()?.getEndpoint() ?? DEMO_ENDPOINT;
        // Apply a server's settings and point it at the current endpoint when it becomes active.
        const onReady = (client, settings) => {
          qlueLs.configureSettings(client, settings);
          qlueLs.configureBackend(client, endpointOf());
        };
        const onEndpointChange = (client, endpoint) => qlueLs.configureBackend(client, endpoint);
        const fullSettings = qlueLs.defaultSettings;
        const alignedSettings = {
          ...qlueLs.defaultSettings,
          format: { ...qlueLs.defaultSettings.format, whereNewLine: true, alignPredicates: true },
        };

        window.yasgui = new Yasgui(document.getElementById("yasgui"), {
          requestConfig: { endpoint: DEMO_ENDPOINT },
          yasqe: (parent, conf) =>
            new Yasqe(parent, {
              ...conf,
              theme,
              languageServers: [
                {
                  label: "Qlue-ls",
                  description: "SPARQL language server with endpoint-powered completions",
                  worker: createQlueLsWorker,
                  onReady: (client) => onReady(client, fullSettings),
                  onEndpointChange,
                },
                {
                  label: "Qlue-ls (aligned)",
                  description: "Same engine, alternative formatting (WHERE on its own line, aligned predicates)",
                  worker: createQlueLsWorker,
                  onReady: (client) => onReady(client, alignedSettings),
                  onEndpointChange,
                },
              ],
            }),
        });
      };
    </script>
  </body>
</html>
